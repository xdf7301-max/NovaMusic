name: 🚀 Deploy NOVA MUSIC a GitHub Pages

on:
  # Se ejecuta automáticamente cada vez que haces push a la rama main
  push:
    branches:
      - main
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos deploys corran al mismo tiempo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─── Paso 1: Construir el proyecto ───────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔨 Construir proyecto (npm run build)
        run: npm run build

      - name: 📤 Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ─── Paso 2: Publicar en GitHub Pages ────────────────────────────────────────
  deploy:
    name: 🌐 Deploy a GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
